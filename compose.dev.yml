services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend-adhp
    image: adhp_backend
    ports:
      - 8301:8301
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      # banco pg-adhp (TFS-RUST-Many/tools/databases) na rede adhp; 5497 é só a porta no host
      DATABASE_PORT: 5432
      DATABASE_HOST: pg-adhp
      CODE_HANDLER_API_URL: http://code_handler:8302
      CODE_HANDLER_KEY: ${CODE_HANDLER_KEY}
      SALTDB: ${SALTDB}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MY_SIGNING_KEY: ${MY_SIGNING_KEY}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      - pgadmin
    networks:
      - adhp

  frontend-adhp:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-adhp
    image: adhp_frontend
    ports:
      - "5190:5190"
      - "24678:24678"
    environment:
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # nitro deixa sockets worker-<pid>-1.sock em /tmp/nitro; no restart o PID se repete,
    # o listen dá EADDRINUSE e toda página fica pendurada. tmpfs zera o /tmp a cada start.
    tmpfs:
      - /tmp
    depends_on:
      - backend
    networks:
      - adhp

  code_handler:
    build:
      context: ./code_handler
      dockerfile: Dockerfile.dev
    container_name: code-handler-adhp
    image: adhp_code_handler
    ports:
      - 8302:8302
    environment:
      CODE_HANDLER_KEY: ${CODE_HANDLER_KEY}
      CODE_HANDLER_REMOVE_FILES: ${CODE_HANDLER_REMOVE_FILES}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - codes:/codes
    networks:
      - adhp

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-adhp
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - 8381:80
    volumes:
      - pgadmin:/var/lib/pgadmin
    networks:
      - adhp

volumes:
  pgadmin:
    driver: local
  codes:
    driver: local

networks:
  adhp:
    external: true
