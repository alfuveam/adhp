services:
  backend:
    image: ghcr.io/alfuveam/adhp/backend:latest
    container_name: backend-adhp
    restart: unless-stopped
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      # banco pg-adhp (TFS-RUST-Many/tools/databases): host/porta do .env.prod
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_HOST: ${DATABASE_HOST}
      CODE_HANDLER_API_URL: ${CODE_HANDLER_API_URL}
      CODE_HANDLER_KEY: ${CODE_HANDLER_KEY}
      SALTDB: ${SALTDB}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MY_SIGNING_KEY: ${MY_SIGNING_KEY}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "8301:8301"
    networks:
      - adhp

  frontend-adhp:
    image: ghcr.io/alfuveam/adhp/frontend:latest
    container_name: frontend-adhp
    ports:
      - "5190:5190"
    environment:
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      NUXT_PUBLIC_NUXT_API_URL: ${NUXT_PUBLIC_NUXT_API_URL}
      NUXT_PUBLIC_DISCENTE: ${NUXT_PUBLIC_DISCENTE}
      NUXT_PUBLIC_DOCENTE: ${NUXT_PUBLIC_DOCENTE}
      NUXT_USE_MONACO_EDITOR: ${NUXT_USE_MONACO_EDITOR}
    networks:
      - adhp

  code_handler:
    image: ghcr.io/alfuveam/adhp/code_handler:latest
    container_name: code-handler-adhp
    environment:
      CODE_HANDLER_KEY: ${CODE_HANDLER_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - codes:/codes
    ports:
      - "8302:8302"
    networks:
      - adhp

volumes:
  codes:
    driver: local

networks:
  adhp:
    external: true
